<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спираль — Симулятор Сознания</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --accent: #d8c3a5;
    --accent-glow: #e8d5b7;
    --bg-dark: #05030a;
  }
  body {
    background: var(--bg-dark);
    color: #e8e6f0;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    line-height: 1.5;
  }
  
  #bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background 1.2s ease;
  }
  #bg::before {
    content: ''; position: absolute; inset: -50%;
    background: conic-gradient(from 0deg, transparent 0deg, var(--accent-glow) 45deg, transparent 90deg, var(--accent-glow) 135deg, transparent 180deg, var(--accent-glow) 225deg, transparent 270deg, var(--accent-glow) 315deg, transparent 360deg);
    opacity: 0.04;
    animation: spin 40s linear infinite;
    -webkit-mask: radial-gradient(circle, transparent 10%, black 80%);
    mask: radial-gradient(circle, transparent 10%, black 80%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app {
    width: 100%; max-width: 850px; height: 100vh;
    padding: 15px; display: flex; flex-direction: column; gap: 12px;
    position: relative; z-index: 2;
  }

  /* HUD */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    backdrop-filter: blur(12px);
  }
  .level-badge { display: flex; align-items: center; gap: 12px; width: 150px;}
  .level-dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 20px var(--accent-glow);
    transition: all 0.6s ease;
  }
  .level-name { font-size: 15px; font-weight: 600; white-space: nowrap; }
  
  .progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; margin: 0 15px; }
  .progress-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; white-space: nowrap; }
  .progress-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #fff; transition: width 0.4s ease; border-radius: 4px; }

  .stress-wrap { display: flex; align-items: center; gap: 10px; width: 180px; }
  .stress-label { font-size: 10px; color: #e74c3c; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; white-space: nowrap;}
  .stress-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .stress-fill { height: 100%; width: 0%; background: #e74c3c; transition: width 0.6s ease; border-radius: 4px; }
  .stress-fill.high { animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .codex-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: #ccc; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font-family: sans-serif; font-size: 11px; transition: 0.2s;
  }
  .codex-btn:hover { background: rgba(255,255,255,0.1); color:#fff; }

  /* Сцена */
  .scene {
    flex: 1; background: rgba(255,255,255,0.01);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 20px;
    padding: 24px; display: flex; flex-direction: column; gap: 20px;
    backdrop-filter: blur(12px); overflow-y: auto; scrollbar-width: thin;
  }
  .scene::-webkit-scrollbar { width: 6px; }
  .scene::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

  .npc-name { font-size: 11px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--accent); font-family: sans-serif; font-weight: 700; margin-bottom: 8px; }
  .npc-text { font-size: 17px; line-height: 1.6; color: #e0dde8; }

  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 10px;}
  .choice {
    padding: 16px 20px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    cursor: pointer; font: inherit; color: inherit; text-align: left;
    font-size: 15px; line-height: 1.5; transition: all 0.22s ease;
  }
  .choice:hover { background: rgba(255,255,255,0.06); border-color: var(--accent); transform: translateX(4px); }
  .choice:disabled { cursor: default; opacity: 0.5; transform: none; }

  /* Фидбек */
  .feedback {
    padding: 22px; border-radius: 16px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;
    animation: fadeUp 0.4s ease; margin-top: auto;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .feedback-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; font-family: sans-serif; font-weight: 700; }
  .feedback-text { font-size: 15px; line-height: 1.6; color: #ddd; }
  .mirror-note { font-size: 14px; color: #ff7b7b; font-style: italic; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); line-height: 1.5; }

  .btn {
    padding: 14px 24px; background: var(--accent); color: #0a0612;
    border: none; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; align-self: flex-start;
    box-shadow: 0 4px 20px var(--accent-glow); font-family: sans-serif;
    margin-top: 10px;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.15); }

  /* Модальное окно */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10;
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(5px);
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #110d1c; border: 1px solid rgba(255,255,255,0.1);
    width: 100%; max-width: 850px; max-height: 85vh; border-radius: 20px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { font-size: 20px; font-weight: 400; letter-spacing: 1px; }
  .close-btn { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
  .close-btn:hover { color: #fff; }
  
  .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  
  .level-card {
    display: flex; gap: 16px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px;
    align-items: flex-start;
  }
  .level-color { width: 8px; border-radius: 4px; align-self: stretch; flex-shrink: 0; }
  .level-info { flex: 1; }
  .level-info h3 { font-size: 18px; margin-bottom: 4px; font-weight: 500; }
  .level-info .desc { font-size: 14px; color: #aaa; margin-bottom: 10px; font-style: italic; }
  
  .level-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
  .detail-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
  .detail-box strong { display: block; color: #888; font-size: 10px; text-transform: uppercase; margin-bottom: 4px; font-family: sans-serif; }

  /* Экраны интро / финала */
  .intro, .ending { text-align: center; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
  .intro h1 { font-size: 42px; letter-spacing: 6px; background: linear-gradient(135deg, #d8c3a5, #f1c40f, #1abc9c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 400; }
  .sub { font-size: 11px; letter-spacing: 3px; color: #888; text-transform: uppercase; font-family: sans-serif; }
  .intro p, .ending p { font-size: 15px; line-height: 1.6; color: #ccc; text-align: left; }
  .intro .btn, .ending .btn { align-self: center; margin-top: 10px; }

  @media (max-width: 600px) {
    .hud { flex-wrap: wrap; gap: 10px; }
    .progress-wrap { order: 3; width: 100%; margin: 0; }
    .stress-wrap { width: auto; flex: 1; justify-content: flex-end; }
    .level-details { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div class="hud" id="hud" style="display:none">
    <div class="level-badge">
      <div class="level-dot" id="levelDot"></div>
      <div class="level-name" id="levelName">Бежевый</div>
    </div>
    
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">Рефлексия: 0/10</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="stress-wrap">
      <div class="stress-label">Амигдала</div>
      <div class="stress-bar"><div class="stress-fill" id="stressFill"></div></div>
    </div>
    
    <button class="codex-btn" id="openCodex">Кодекс</button>
  </div>
  
  <div class="scene" id="scene"></div>
</div>

<!-- Модальное окно Кодекса -->
<div class="modal" id="codexModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Кодекс Уровней Сознания</h2>
      <button class="close-btn" id="closeCodex">&times;</button>
    </div>
    <div class="modal-body" id="codexBody"></div>
  </div>
</div>

<script>

  1: 10,   // 1 -> 2

  5: 80,   // 5 -> 6
  6: 120,  // 6 -> 7

   БАЗА СЦЕНАРИЕВ (Часть 1: ~70 ситуаций)

   ЛОГИКА ИГРЫ
   ============================================================ */
let state = { level: 1, progress: 0, stress: 0, finished: false, usedScenarios: new Set() };
const $ = id => document.getElementById(id);

function updateUI() {
  const lvl = LEVELS[state.level - 1];
  document.documentElement.style.setProperty('--accent', lvl.color);
  document.documentElement.style.setProperty('--accent-glow', lvl.glow);
  $('levelDot').style.background = lvl.color;
  $('levelDot').style.boxShadow = `0 0 20px ${lvl.glow}`;
  $('levelName').textContent = lvl.name;
  
  const req = PROGRESS_REQUIRED[state.level];
  $('progressLabel').textContent = `Рефлексия: ${state.progress}/${req}`;
  $('progressFill').style.width = `${Math.min(100, (state.progress / req) * 100)}%`;
  $('progressFill').style.background = lvl.color;

  $('stressFill').style.width = `${state.stress}%`;
  $('stressFill').classList.toggle('high', state.stress >= 70);
  $('bg').style.background = `radial-gradient(circle at 50% 50%, ${lvl.glow}22 0%, transparent 70%)`;
}

function clearScene() { $('scene').innerHTML = ''; }

function showIntro() {
  $('hud').style.display = 'none';
  clearScene();
  $('scene').innerHTML = `
    <div class="intro">
      <div class="sub">Нейробиология и Спиральная динамика</div>
      <h1>СПИРАЛЬ</h1>
      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border-left: 3px solid #e74c3c; margin-bottom: 10px;">
        <p style="font-size: 14px; margin-bottom: 0;">
          <strong>Научная модель:</strong> В реальном мире большинство людей застревают на Синим (Порядок) и Оранжевом (Успех). Переход на Жёлтый (Система) требует колоссальной рефлексии.<br><br>
          В этой игре вам нужно набрать <strong>от 10 до 250 правильных ответов</strong> для перехода. Ошибки вызывают выброс кортизола (<strong>стресс</strong>). При стрессе 100% происходит «Амигдала-хайджекинг» — вы теряете уровень.
        </p>
      </div>
      <button class="btn" id="startBtn">Начать эволюцию</button>
      <button class="btn" id="codexBtnIntro" style="background:transparent; border:1px solid #444; color:#ccc; box-shadow:none; margin-top:0;">Кодекс Уровней</button>
    </div>
  `;
  $('startBtn').onclick = startGame;
  $('codexBtnIntro').onclick = openCodex;
}

function startGame() {
  state = { level: 1, progress: 0, stress: 0, finished: false, usedScenarios: new Set() };
  $('hud').style.display = 'flex';
  updateUI();
  nextScenario();
}

function nextScenario() {
  if (state.finished) return;
  if (state.level >= 8) return showVictory();
  
  let pool = SCENARIOS.filter(s => !state.usedScenarios.has(s));
  if (pool.length === 0) {
    state.usedScenarios.clear();
    pool = SCENARIOS;
  }
  
  const sc = pool[Math.floor(Math.random() * pool.length)];
  state.usedScenarios.add(sc);
  renderScenario(sc);
}

function renderScenario(sc) {
  clearScene();
  $('scene').innerHTML = `
    <div>
      <div class="npc-name">Ситуация</div>
      <div class="npc-text">${sc.text}</div>
    </div>
    <div class="choices" id="choices"></div>
  `;
  const choices = $('choices');
  const shuffledOptions = [...sc.options].sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = opt.text;
    btn.onclick = () => onChoice(sc, opt);
    choices.appendChild(btn);
  });
}

function onChoice(sc, opt) {
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  const chosenLvl = LEVELS[opt.level - 1];
  let feedbackTitle, feedbackText;
  let color = chosenLvl.color;
  let isCorrect = false;
  
  if (opt.level > state.level) {
    isCorrect = true;
    state.progress++;
    state.stress = Math.max(0, state.stress - 15);
    feedbackTitle = `Ответ из ${chosenLvl.name} уровня`;
    feedbackText = `Вы применили префронтальную кору. Вы поднялись над автоматизмом. +1 к Рефлексии.`;
  } else if (opt.level === state.level) {
    feedbackTitle = `Ответ из ${chosenLvl.name} уровня`;
    feedbackText = `Вы действовали по привычке. Вы сохранили ресурс, но не продвинулись вперед.`;
    state.stress = Math.max(0, state.stress - 5);
  } else {
    feedbackTitle = `Регресс. Ответ из ${chosenLvl.name} уровня`;
    feedbackText = `Вы поддались Амигдале. Вы откатились назад. Потеряно 3 очка рефлексии.`;
    state.stress += 45; 
    state.progress = Math.max(0, state.progress - 3); 
  }

  if (state.stress >= 100) {
    state.stress = 50;
    if (state.level > 1) {
      state.level--;
      state.progress = 0;
      feedbackText += `<br><br><span style="color:#e74c3c; font-weight:bold;">Амигдала-хайджекинг! Стресс 100%. Вы потеряли уровень.</span>`;
    } else {
       state.finished = 'lose';
       return renderFeedback(feedbackTitle, feedbackText, isCorrect, color, true);
    }
  }

  const req = PROGRESS_REQUIRED[state.level];
  if (state.progress >= req) {
    state.level++;
    state.progress = 0;
    updateUI();
    if (state.level >= 8) return showVictory();
    const newLvl = LEVELS[state.level - 1];
    feedbackText += `<br><br><span style="color:${newLvl.color}; font-weight:bold; font-size:18px;">✨ Переход на уровень: ${newLvl.name}!</span>`;
  }

  updateUI();
  renderFeedback(feedbackTitle, feedbackText, isCorrect, color, false);
}

function renderFeedback(title, text, isCorrect, color, isDefeat) {
  clearScene();
  let extraStyle = isDefeat ? "style='color:#e74c3c'" : (isCorrect ? `style='color:${color}'` : "");
  $('scene').innerHTML = `
    <div class="feedback">
      <div class="feedback-title" ${extraStyle}>${title}</div>
      <div class="feedback-text">${text}</div>
      ${!isDefeat && state.stress > 70 ? `<div class="mirror-note">Высокий уровень стресса. Амигдала пытается взять контроль.</div>` : ''}
      <button class="btn" id="contBtn">Дальше</button>
    </div>
  `;
  $('contBtn').onclick = () => isDefeat ? showDefeat() : nextScenario();
}

}

$('openCodex').onclick = openCodex;
$('closeCodex').onclick = closeCodex;
$('codexModal').onclick = (e) => { if (e.target === $('codexModal')) closeCodex(); };

showIntro();
</script>
