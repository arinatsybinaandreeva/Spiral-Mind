<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Психологические тесты</title>
<meta http-equiv="Cache-Control" content="no-store">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0B0B14;--card:#141424;--accent:#6366F1;--green:#10B981;--yellow:#F59E0B;--red:#EF4444;--text:#F1F5F9;--muted:#94A3B8;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:16px}
.screen{display:none;animation:fade .2s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.5rem;margin-bottom:8px}
h2{font-size:1.2rem;margin-bottom:6px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;width:100%;font-family:inherit;background:var(--accent);color:#fff;transition:.15s}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--accent)}
.btn-sm{width:auto;padding:6px 12px;font-size:.8rem}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.tag-green{background:rgba(16,185,129,.15);color:#34D399}
.tag-yellow{background:rgba(245,158,11,.15);color:#FBBF24}
.tag-red{background:rgba(239,68,68,.15);color:#F87171}
.tag-blue{background:rgba(99,102,241,.15);color:#818CF8}
.test-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:.2s}
.test-card:active{border-color:var(--accent)}
.emoji{font-size:2rem}
.progress-bar{height:4px;background:#2D2D4A;border-radius:4px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.chart-container{height:180px;margin:16px 0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(11,11,20,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px;border-top:1px solid rgba(255,255,255,.05)}
.nav-item{background:none;border:none;color:var(--muted);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;cursor:pointer;padding:6px 12px;border-radius:12px}
.nav-item.active{color:#A78BFA;background:rgba(139,92,246,.1)}
.option-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px;border-radius:10px;font-size:.9rem;cursor:pointer;margin-bottom:6px;text-align:left;width:100%;font-family:inherit;line-height:1.4}
.option-btn:active{background:rgba(99,102,241,.2);border-color:var(--accent)}
.timeline-item{background:rgba(255,255,255,.03);padding:10px;border-radius:10px;margin-bottom:8px;font-size:.85rem}
.text-muted{color:var(--muted);font-size:.8rem}
.overdue-alert{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.qtext{font-size:1.05rem;margin:12px 0;line-height:1.55;word-wrap:break-word}
.group-label{font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 14px;border-radius:20px;font-size:.8rem;font-weight:600;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;transition:.2s}
.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-tab:active{transform:scale(.96)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="homeScreen">
    <h1>🧠 Психологические тесты</h1>
    <p class="text-muted" style="margin-bottom:12px;">Выберите раздел</p>
    <div id="overdueAlert"></div>
    <div class="cat-tabs" id="catTabs"></div>
    <div id="testList"></div>
  </div>
  <div class="screen" id="testScreen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <button class="btn btn-sm btn-outline" id="exitTestBtn">← Выйти</button>
      <span id="testTitle" style="font-weight:600;"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionArea"></div>
    <button class="btn btn-sm btn-outline" id="prevBtn" style="margin-top:12px;display:none;">← Назад</button>
  </div>
  <div class="screen" id="profileScreen">
    <h1>📊 Психологический портрет</h1>
    <div id="profileContent"></div>
  </div>
  <div class="screen" id="historyScreen">
    <h1>📅 История и графики</h1>
    <div id="historyContent"></div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">📋<span>Тесты</span></button>
    <button class="nav-item" data-screen="profile">📊<span>Портрет</span></button>
    <button class="nav-item" data-screen="history">📅<span>История</span></button>
  </nav>
</div>

<script>
window.TESTS = window.TESTS || [];
window.currentCat = 'Все';
</script>

<script>
(function(){
const TESTS = window.TESTS;
let currentTest=null, currentQuestion=0, answers={};
let results=JSON.parse(localStorage.getItem('mindscope_results')||'{}');
let history=JSON.parse(localStorage.getItem('mindscope_history')||'[]');

function saveData(){
  localStorage.setItem('mindscope_results',JSON.stringify(results));
  localStorage.setItem('mindscope_history',JSON.stringify(history));
}

function navigateTo(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screen+'Screen').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-screen="${screen}"]`)?.classList.add('active');
  if(screen==='home') renderHome();
  else if(screen==='profile') renderProfile();
  else if(screen==='history') renderHistory();
  window.scrollTo(0,0);
}
window.navigateTo = navigateTo;

function getCategories(){
  const cats=['Все']; const seen=new Set();
  TESTS.forEach(t=>{ if(!seen.has(t.cat)){ seen.add(t.cat); cats.push(t.cat); } });
  return cats;
}

function renderCatTabs(){
  const cats=getCategories();
  const tabsEl=document.getElementById('catTabs');
  if(!tabsEl) return;
  tabsEl.innerHTML=cats.map(c=>`<button class="cat-tab ${window.currentCat===c?'active':''}" data-cat="${c}">${c}</button>`).join('');
  tabsEl.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      window.currentCat=btn.dataset.cat;
      renderCatTabs(); renderHome();
    });
  });
}

function isOverdue(test){
  const last=results[test.id];
  if(!last) return true;
  const days=Math.floor((Date.now()-new Date(last.date))/(1000*60*60*24));
  return days>=test.freqDays;
}

function renderHome(){
  renderCatTabs();
  const overdue=TESTS.filter(t=>isOverdue(t));
  const oa=document.getElementById('overdueAlert');
  if(oa) oa.innerHTML = overdue.length
    ? `<div class="overdue-alert">⚠️ ${overdue.length} тестов требуют обновления</div>` : '';
  let filtered=TESTS;
  if(window.currentCat!=='Все') filtered=TESTS.filter(t=>t.cat===window.currentCat);
  const listEl=document.getElementById('testList');
  if(!listEl) return;
  if(!filtered.length){ listEl.innerHTML='<div class="empty-state">Тесты пока не загружены</div>'; return; }
  let html='';
  filtered.forEach(test=>{
    const last=results[test.id];
    const lastDate=last?new Date(last.date).toLocaleDateString('ru-RU'):null;
    const overdueTest=isOverdue(test);
    html+=`
      <div class="test-card" onclick="startTest('${test.id}')">
        <div class="emoji">${test.emoji}</div>
        <div style="flex:1;word-wrap:break-word;">
          <div style="font-weight:600;">${test.name}</div>
          <div class="text-muted">${test.desc}</div>
          <div style="margin-top:6px;">
            ${lastDate?`<span class="tag ${overdueTest?'tag-red':'tag-green'}">${overdueTest?'⏰ Просрочен':'✅ '+lastDate}</span>`:'<span class="tag tag-blue">Новый</span>'}
            <span class="text-muted" style="margin-left:6px;">△ ${test.freqDays} дн.</span>
          </div>
        </div>
      </div>`;
  });
  listEl.innerHTML=html;
}

window.startTest=function(id){
  currentTest=TESTS.find(t=>t.id===id);
  if(!currentTest) return;
  currentQuestion=0; answers={};
  const tt=document.getElementById('testTitle');
  if(tt) tt.textContent=currentTest.name;
  navigateTo('test'); renderQuestion();
};

function renderQuestion(){
  const test=currentTest;
  const q=test.questions[currentQuestion];
  const pf=document.getElementById('progressFill');
  if(pf) pf.style.width=((currentQuestion/test.questions.length)*100)+'%';
  const pb=document.getElementById('prevBtn');
  if(pb) pb.style.display=currentQuestion>0?'inline-flex':'none';
  let html=`<div class="card">`;
  if(q.group) html+=`<div class="group-label">${q.group}</div>`;
  html+=`<p class="text-muted">Вопрос ${currentQuestion+1}/${test.questions.length}</p>
    <p class="qtext">${q.text}</p>`;
  if(test.type==='yn'){
    html+=`<button class="btn btn-outline" style="margin-bottom:8px;" onclick="answerQuestion(true)">Да</button>`;
    html+=`<button class="btn btn-outline" onclick="answerQuestion(false)">Нет</button>`;
  } else {
    test.scale.forEach((label,idx)=>{
      html+=`<button class="option-btn" onclick="answerQuestion(${idx})">${label}</button>`;
    });
  }
  html+=`</div>`;
  const qa=document.getElementById('questionArea');
  if(qa) qa.innerHTML=html;
}

window.answerQuestion=function(value){
  answers[currentQuestion]=value;
  currentQuestion++;
  if(currentQuestion>=currentTest.questions.length) finishTest();
  else renderQuestion();
};

function finishTest(){
  const test=currentTest;
  let scores={};
  test.questions.forEach((q,idx)=>{
    const trait=q.trait||'total';
    if(!scores[trait]) scores[trait]=0;
    let val=answers[idx];
    if(test.type==='yn'){
      let num = val===true ? 1 : 0;
      if(q.reverse) num = 1-num;
      scores[trait]+=num;
    } else {
      let num = val;
      if(q.reverse) num = (test.scale.length-1) - num;
      scores[trait]+=num;
    }
  });
  const result={testId:test.id,testName:test.name,scores,date:new Date().toISOString()};
  results[test.id]=result;
  history.unshift(result);
  if(history.length>500) history.length=500;
  saveData();

  const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
  const interpInput=(test.type==='yn'||hasTraits)?scores:(scores.total||0);
  const interpretation=test.interpret(interpInput);

  let html='<div class="card"><h2>✅ Результат</h2>';
  interpretation.forEach(item=>{
    html+=`
      <div style="margin:12px 0;padding:12px;background:rgba(255,255,255,.03);border-radius:12px;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
          <strong>${item.name}</strong>
          ${item.max>0?`<span class="tag tag-${item.color}">${item.value} / ${item.max}</span>`:''}
        </div>
        <p style="font-size:.9rem;margin-top:6px;word-wrap:break-word;">${item.desc}</p>
      </div>`;
  });
  html+=`<button class="btn btn-primary" onclick="navigateTo('profile')" style="margin-top:10px;">📊 К портрету</button>`;
  html+=`<button class="btn btn-outline" onclick="navigateTo('home')" style="margin-top:6px;">📋 К тестам</button></div>`;
  const qa=document.getElementById('questionArea');
  if(qa) qa.innerHTML=html;
}

function renderProfile(){
  const done=Object.values(results);
  const pc=document.getElementById('profileContent');
  if(!pc) return;
  if(!done.length){ pc.innerHTML='<p class="text-muted">Пройдите тесты для построения портрета.</p>'; return; }
  let green=[],yellow=[],red=[];
  done.forEach(r=>{
    const test=TESTS.find(t=>t.id===r.testId);
    if(!test) return;
    const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
    const interpInput=(test.type==='yn'||hasTraits)?r.scores:(r.scores.total||0);
    const interp=test.interpret(interpInput);
    interp.forEach(i=>{
      const entry={...i,testName:test.name};
      if(i.color==='green') green.push(entry);
      else if(i.color==='yellow') yellow.push(entry);
      else red.push(entry);
    });
  });
  pc.innerHTML=`
    <div class="card"><h3>🟢 Сильные стороны (${green.length})</h3>${green.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}</div>
    <div class="card"><h3>🟡 Зоны внимания (${yellow.length})</h3>${yellow.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}</div>
    <div class="card"><h3>🔴 Требует проработки (${red.length})</h3>${red.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}${red.length?'<p style="color:#F87171;font-size:.8rem;margin-top:8px;">⚠️ Рекомендована консультация психолога</p>':''}</div>
  `;
}

function renderHistory(){
  const hc=document.getElementById('historyContent');
  if(!hc) return;
  if(!history.length){ hc.innerHTML='<p class="text-muted">История пуста.</p>'; return; }
  const grouped={};
  history.forEach(h=>{ if(!grouped[h.testId]) grouped[h.testId]=[]; grouped[h.testId].push(h); });
  let html='<div class="card"><h3>📈 Динамика по тестам</h3>';
  Object.entries(grouped).forEach(([tid,items])=>{
    if(items.length<2) return;
    const test=TESTS.find(t=>t.id===tid);
    if(!test) return;
    html+=`<p style="margin:10px 0 4px;">${test.emoji} ${test.name}</p><div class="chart-container"><canvas id="chart-${tid}"></canvas></div>`;
  });
  html+='</div><div class="card"><h3>🕐 Хронология</h3>';
  history.slice(0,30).forEach(h=>{
    const test=TESTS.find(t=>t.id===h.testId);
    if(!test) return;
    const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
    const interpInput=(test.type==='yn'||hasTraits)?h.scores:(h.scores.total||0);
    const interp=test.interpret(interpInput);
    html+=`<div class="timeline-item">
      <div class="text-muted">📅 ${new Date(h.date).toLocaleString('ru-RU')}</div>
      <strong>${h.testName}</strong>
      <div style="margin-top:4px;">${interp.map(i=>`<span class="tag tag-${i.color}" style="margin-right:4px;margin-bottom:4px;">${i.name}: ${i.max>0?i.value+'/'+i.max:(i.color==='green'?'✓':'!')}</span>`).join('')}</div>
    </div>`;
  });
  html+='</div>';
  hc.innerHTML=html;

  setTimeout(()=>{
    Object.entries(grouped).forEach(([tid,items])=>{
      if(items.length<2) return;
      const canvas=document.getElementById('chart-'+tid);
      if(!canvas) return;
      const sorted=[...items].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const key=Object.keys(sorted[0].scores)[0]||'total';
      new Chart(canvas,{
        type:'line',
        data:{labels:sorted.map(i=>new Date(i.date).toLocaleDateString('ru-RU')),
          datasets:[{data:sorted.map(i=>i.scores[key]||0),borderColor:'#818CF8',backgroundColor:'rgba(129,140,248,.1)',fill:true,tension:.4,pointRadius:3}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
      });
    });
  },100);
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>navigateTo(btn.dataset.screen));
});
const exitBtn=document.getElementById('exitTestBtn');
if(exitBtn) exitBtn.addEventListener('click',()=>navigateTo('home'));
const prevBtn=document.getElementById('prevBtn');
if(prevBtn) prevBtn.addEventListener('click',()=>{
  if(currentQuestion>0){ currentQuestion--; delete answers[currentQuestion]; renderQuestion(); }
});

window.addEventListener('load',()=>{ renderHome(); renderCatTabs(); });
setTimeout(()=>{ renderHome(); renderCatTabs(); },100);
})();
</script>
<script>
TESTS.push(
{
  id:'adhd_asrs', cat:'Расстройства', emoji:'🌀',
  name:'СДВГ у взрослых (ASRS v1.1)',
  freqDays:180,
  desc:'Симптомы дефицита внимания и гиперактивности',
  type:'likert',
  scale:['Никогда','Редко','Иногда','Часто','Очень часто'],
  questions:[
    {text:'Как часто вам бывает трудно довести до конца начатое дело, после того как вы разобрались с самой сложной частью и потеряли интерес к оставшимся деталям?', trait:'total', group:'Внимание'},
    {text:'Как часто вам бывает трудно навести порядок в вещах или бумагах, когда нужно найти что-то важное?', trait:'total', group:'Организация'},
    {text:'Как часто вас отвлекают посторонние звуки, движения или собственные мысли, когда вы пытаетесь сосредоточиться на задаче?', trait:'total', group:'Внимание'},
    {text:'Как часто вам бывает трудно усидеть на месте, когда нужно оставаться в покое — например, на встрече или в транспорте?', trait:'total', group:'Гиперактивность'},
    {text:'Как часто вы чувствуете себя чрезмерно активным, как будто внутри вас работает мотор, который не даёт остановиться?', trait:'total', group:'Гиперактивность'},
    {text:'Как часто вы говорите или действуете импульсивно, не подумав о возможных последствиях?', trait:'total', group:'Импульсивность'},
    {text:'Как часто вам бывает трудно сосредоточиться на чтении книги или рабочего документа дольше нескольких минут?', trait:'total', group:'Внимание'},
    {text:'Как часто вы теряете или забываете важные вещи — ключи, документы, телефон, назначенные встречи?', trait:'total', group:'Организация'},
    {text:'Как часто вам бывает трудно дождаться своей очереди — например, в магазине или в разговоре?', trait:'total', group:'Импульсивность'}
  ],
  interpret:(total)=>[{name:'СДВГ-симптомы', value:total, max:36, color: total>=21?'red':total>=14?'yellow':'green',
    desc: total>=21?'Высокая выраженность симптомов. Рекомендуется консультация психиатра или клинического психолога для полноценной диагностики.':total>=14?'Умеренная выраженность. Стоит обсудить со специалистом.':'Низкая выраженность — в пределах нормы.'}]
},
{
  id:'ocd_ybocs', cat:'Расстройства', emoji:'🔁',
  name:'Навязчивые состояния (Y-BOCS)',
  freqDays:90,
  desc:'Обсессии и компульсии',
  type:'likert',
  scale:['Нет','Слабо','Умеренно','Сильно','Очень сильно'],
  questions:[
    {text:'Как часто вы испытываете навязчивые, нежелательные мысли, которые появляются против вашей воли и трудно прогнать?', trait:'OBS', group:'Обсессии'},
    {text:'Насколько сильно эти навязчивые мысли мешают вам в повседневной жизни — работе, учёбе, общении?', trait:'OBS', group:'Обсессии'},
    {text:'Сколько времени в течение дня вы тратите на эти навязчивые мысли?', trait:'OBS', group:'Обсессии'},
    {text:'Насколько трудно вам сопротивляться этим мыслям и не вовлекаться в них?', trait:'OBS', group:'Обсессии'},
    {text:'Насколько вы можете контролировать появление этих навязчивых мыслей?', trait:'OBS', group:'Обсессии', reverse:true},
    {text:'Как часто вы совершаете повторяющиеся действия (ритуалы) — например, проверяете, моете руки, считаете — чтобы снизить тревогу?', trait:'COMP', group:'Компульсии'},
    {text:'Насколько сильно эти ритуалы мешают вашей повседневной жизни?', trait:'COMP', group:'Компульсии'},
    {text:'Сколько времени в течение дня вы тратите на выполнение ритуалов?', trait:'COMP', group:'Компульсии'},
    {text:'Насколько трудно вам сопротивляться желанию выполнить ритуал, когда оно возникает?', trait:'COMP', group:'Компульсии'},
    {text:'Насколько вы можете контролировать выполнение ритуалов?', trait:'COMP', group:'Компульсии', reverse:true}

{
  id:'epi', cat:'Личность', emoji:'🧬',
  name:'Личностный опросник Айзенка (EPI)',
  freqDays:180,
  desc:'Экстраверсия, нейротизм, искренность',
  type:'yn',
  questions:[
    {text:'Часто ли вы испытываете тягу к новым впечатлениям, к тому, чтобы испытать сильные ощущения?', trait:'E'},
    {text:'Часто ли вы нуждаетесь в друзьях, которые могут вас понять, ободрить или посочувствовать?', trait:'N'},
    {text:'Считаете ли вы себя человеком беспечным, беззаботным?', trait:'E'},
    {text:'Трудно ли вам отказываться от своих намерений, даже если они уже невыполнимы?', trait:'N'},
    {text:'Вы обдумываете свои дела не спеша, предпочитаете подождать, прежде чем действовать?', trait:'E', reverse:true},
    {text:'Всегда ли вы сдерживаете обещания, даже если это вам невыгодно?', trait:'L'},
    {text:'Часто ли у вас бывают спады и подъёмы настроения без видимой причины?', trait:'N'},
    {text:'Вы обычно действуете быстро, не раздумывая, не тратя время на размышления?', trait:'E'},
    {text:'Часто ли вы чувствовали себя несчастным без серьёзной причины?', trait:'N'},
    {text:'Способны ли вы пойти на всё ради спора, чтобы доказать свою правоту?', trait:'E'}
  ],
  interpret:(s)=>{
    const e=s.E||0, n=s.N||0, l=s.L||0;
    return [
      {name:'Экстраверсия', value:e, max:10, color: e>=7?'green':e<=3?'yellow':'green',
        desc: e>=7?'Вы выраженный экстраверт: общительны, активны, черпаете энергию от людей.':e<=3?'Вы интроверт: спокойны, сдержанны, цените уединение.':'Вы амбиверт: гибко сочетаете общительность и уединение.'},
      {name:'Нейротизм', value:n, max:10, color: n>=7?'red':n<=3?'green':'yellow',
        desc: n>=7?'Высокий нейротизм: эмоционально чувствительны, склонны к тревоге.':n<=3?'Низкий нейротизм: эмоционально устойчивы.':'Средний нейротизм: умеренная эмоциональность.'},
      {name:'Искренность', value:l, max:4, color: l>=3?'yellow':'green',
        desc: l>=3?'Возможна тенденция к социально одобряемым ответам.':'Ответы достаточно искренние.'}
    ];
  }
},
{
  id:'big5', cat:'Личность', emoji:'🌟',
  name:'Большая пятёрка (Big Five)',
  freqDays:180,
  desc:'5 фундаментальных черт',
  type:'likert',
  scale:['Совершенно не согласен','Скорее не согласен','Затрудняюсь','Скорее согласен','Полностью согласен'],
  questions:[
    {text:'Я чувствую себя комфортно в большой компании, легко знакомлюсь с новыми людьми.', trait:'E'},
    {text:'Я часто испытываю тревогу и беспокойство даже по незначительным поводам.', trait:'N'},
    {text:'Я всегда довожу начатое дело до конца, даже если оно требует больших усилий.', trait:'C'},
    {text:'Я стараюсь учитывать интересы других людей, даже когда мне это невыгодно.', trait:'A'},
    {text:'Мне нравится размышлять об абстрактных вещах, фантазировать, придумывать новое.', trait:'O'},
    {text:'Я предпочитаю проводить свободное время в одиночестве, а не в шумной компании.', trait:'E', reverse:true},
    {text:'Я редко расстраиваюсь, даже в стрессовых ситуациях сохраняю спокойствие.', trait:'N', reverse:true},
    {text:'Я тщательно планирую свои дела, поддерживаю порядок в вещах и мыслях.', trait:'C'},
    {text:'Я часто критикую других, замечаю их недостатки раньше достоинств.', trait:'A', reverse:true},
    {text:'Мне интересно узнавать новое, я люблю искусство, музыку, необычные идеи.', trait:'O'}
  ],
  interpret:(s)=>{
    const names={E:'Экстраверсия',N:'Нейротизм',C:'Сознательность',A:'Дружелюбие',O:'Открытость'};
    return Object.keys(names).map(k=>{
      const v=s[k]||0,pct=Math.round(v/40*100);
      return {name:names[k],value:v,max:40,
        color: k==='N' ? (pct>=70?'red':pct>=40?'yellow':'green') : (pct>=70?'green':pct>=40?'yellow':'yellow'),
        desc: k==='N'
          ? (pct>=70?'Высокий нейротизм: склонность к тревоге.':pct>=40?'Средний уровень.':'Низкий нейротизм: устойчивость.')
          : (pct>=70?'Высокий уровень — черта ярко выражена.':pct>=40?'Средний уровень — выражена умеренно.':'Низкий уровень — выражена слабо.')};
    });
  }
},
